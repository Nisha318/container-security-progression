<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="system-ui, -apple-system, sans-serif">

  <rect width="680" height="470" fill="#FAFAF9"/>

  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#1C1B18">Stage 2: ECS Fargate Architecture</text>

  <!-- Internet -->
  <rect x="55" y="35" width="140" height="40" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="125" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#1E40AF">Internet</text>
  <text x="125" y="66" text-anchor="middle" font-size="11" fill="#1E40AF">HTTPS traffic</text>

  <!-- Arrow: Internet to ALB -->
  <line x1="125" y1="75" x2="125" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- VPC outer boundary (dashed) - right edge at x=416, bottom at y=398 -->
  <rect x="16" y="68" width="400" height="330" rx="12" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="30" y="84" font-size="11" fill="#666">VPC 10.0.0.0/16</text>

  <!-- Public subnets -->
  <rect x="36" y="88" width="360" height="120" rx="8" fill="none" stroke="#AAA" stroke-width="0.75"/>
  <text x="50" y="104" font-size="11" fill="#666">Public subnets</text>

  <!-- ALB -->
  <rect x="56" y="110" width="140" height="52" rx="6" fill="#CCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="126" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#14532D">Load balancer</text>
  <text x="126" y="148" text-anchor="middle" font-size="11" fill="#14532D">HTTPS port 443</text>

  <!-- NAT Gateway -->
  <rect x="220" y="110" width="155" height="52" rx="6" fill="#CCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="297" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#14532D">NAT gateway</text>
  <text x="297" y="148" text-anchor="middle" font-size="11" fill="#14532D">Outbound internet</text>

  <!-- Arrow: ALB to ECS Task -->
  <line x1="125" y1="162" x2="125" y2="246" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Private subnets -->
  <rect x="36" y="224" width="360" height="150" rx="8" fill="none" stroke="#AAA" stroke-width="0.75"/>
  <text x="50" y="240" font-size="11" fill="#666">Private subnets, no public IPs</text>

  <!-- ECS Fargate Task -->
  <rect x="56" y="248" width="145" height="72" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="128" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">ECS Fargate task</text>
  <text x="128" y="285" text-anchor="middle" font-size="11" fill="#4C1D95">non-root, read-only FS</text>
  <text x="128" y="302" text-anchor="middle" font-size="11" fill="#4C1D95">GD agent injected</text>

  <!-- VPC Endpoints -->
  <rect x="220" y="248" width="155" height="72" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="297" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">VPC endpoints</text>
  <text x="297" y="285" text-anchor="middle" font-size="11" fill="#4C1D95">ECR, Secrets Manager</text>
  <text x="297" y="302" text-anchor="middle" font-size="11" fill="#4C1D95">CloudWatch, ECS</text>

  <!-- Trunk: horizontal from VPC Endpoints right edge to x=432 -->
  <line x1="375" y1="284" x2="432" y2="284" stroke="#888" stroke-width="1.5"/>
  <!-- Trunk: vertical up to ECR level -->
  <line x1="432" y1="110" x2="432" y2="284" stroke="#888" stroke-width="1.5"/>
  <!-- Trunk: vertical down to ECS control plane level -->
  <line x1="432" y1="284" x2="432" y2="350" stroke="#888" stroke-width="1.5"/>

  <!-- Branch arrows to AWS services -->
  <line x1="432" y1="110" x2="456" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="432" y1="170" x2="456" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="432" y1="230" x2="456" y2="230" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="432" y1="290" x2="456" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="432" y1="350" x2="456" y2="350" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ECR -->
  <rect x="456" y="88" width="184" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#78350F">Amazon ECR</text>
  <text x="548" y="121" text-anchor="middle" font-size="11" fill="#78350F">Private image registry</text>

  <!-- Secrets Manager -->
  <rect x="456" y="148" width="184" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#78350F">Secrets Manager</text>
  <text x="548" y="181" text-anchor="middle" font-size="11" fill="#78350F">Injected at startup</text>

  <!-- CloudWatch Logs -->
  <rect x="456" y="208" width="184" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#78350F">CloudWatch Logs</text>
  <text x="548" y="241" text-anchor="middle" font-size="11" fill="#78350F">Container stdout/stderr</text>

  <!-- GuardDuty -->
  <rect x="456" y="268" width="184" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#78350F">GuardDuty</text>
  <text x="548" y="301" text-anchor="middle" font-size="11" fill="#78350F">Runtime threat detection</text>

  <!-- ECS Control Plane -->
  <rect x="456" y="328" width="184" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#78350F">ECS control plane</text>
  <text x="548" y="361" text-anchor="middle" font-size="11" fill="#78350F">ecs, ecs-agent, telemetry</text>

  <!-- Legend: positioned right of VPC, below all service boxes - clear of VPC boundary -->
  <text x="456" y="396" font-size="11" font-weight="600" fill="#555">Legend</text>
  <rect x="456" y="405" width="10" height="10" rx="2" fill="#CCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="472" y="414" font-size="11" fill="#444">Public tier</text>
  <rect x="530" y="405" width="10" height="10" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="546" y="414" font-size="11" fill="#444">Private tier</text>
  <rect x="608" y="405" width="10" height="10" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="624" y="414" font-size="11" fill="#444">AWS</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

</svg>
